name: Diagnostic Console next UI

on:
  pull_request:
    branches:
      - feat/auth-gated-console-20260825

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test test/relnet-next-ui.test.js
