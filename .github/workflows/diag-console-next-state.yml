name: Diagnostic Console next state
on:
  pull_request:
    branches: [feat/auth-gated-console-20260825]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test --test-name-pattern="Access page|Mandatory UI states|Console branding" test/relnet-next-ui.test.js
