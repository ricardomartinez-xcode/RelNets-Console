name: Diagnostic Console tests B

on:
  pull_request:
    branches:
      - feat/auth-gated-console-20260825

permissions:
  contents: read

jobs:
  tests-b:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test test/relnet-next-ui.test.js test/relnet-product-console.test.js test/stripe-billing-console.test.js test/vercel-preview-adapter.test.js
