name: Smoke - Registration UI

on:
  push:
    branches: ['test/v90-console-smoke-split-20260817']

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: registration UI is reachable through canonical Console
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --max-redirs 5 \
            --connect-timeout 10 --max-time 30 \
            --output /tmp/body \
            --write-out '%{http_code}\n%{url_effective}\n' \
            https://console.relead.com.mx/register > /tmp/meta
          test "$(sed -n '1p' /tmp/meta)" = 200
          grep -qi '<form' /tmp/body
          grep -Eqi 'registr|crear.*cuenta|sign.?up' /tmp/body
