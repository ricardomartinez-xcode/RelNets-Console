name: Diagnostic Console tests A

on:
  pull_request:
    branches:
      - feat/auth-gated-console-20260825

permissions:
  contents: read

jobs:
  tests-a:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test test/auth-gate.test.js test/canonical-redirects.test.js test/northbound-contract.test.js test/policy.test.js
