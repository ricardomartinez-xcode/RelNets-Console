name: Production Console Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - 'test/v90-console-production-smoke-*'

permissions:
  contents: read

jobs:
  public-console:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Health is healthy
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            https://console.relnets.com/healthz \
            --output /tmp/healthz.body

      - name: Readiness is truthful and ready
        run: |
          set -euo pipefail
          code="$(curl --silent --show-error \
            --max-redirs 0 --connect-timeout 10 --max-time 30 \
            --output /tmp/readyz.body \
            --dump-header /tmp/readyz.headers \
            --write-out '%{http_code}' \
            https://console.relnets.com/readyz || true)"
          echo "readyz_status=$code"
          test "$code" = 200
          ! grep -qi '^location:' /tmp/readyz.headers
          ! grep -Eqi '<html|oauth|login' /tmp/readyz.body

      - name: Login and signup are reachable
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --max-redirs 0 --connect-timeout 10 --max-time 30 \
            https://console.relnets.com/login \
            --output /tmp/login.html
          curl --fail --silent --show-error \
            --max-redirs 0 --connect-timeout 10 --max-time 30 \
            https://console.relnets.com/signup \
            --output /tmp/signup.html
          grep -qi '<form' /tmp/login.html
          grep -qi '<form' /tmp/signup.html
          grep -qi 'password' /tmp/login.html
          grep -qi 'password' /tmp/signup.html
          grep -qi 'minlength="6"' /tmp/signup.html

      - name: OIDC discovery and JWKS are valid JSON surfaces
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --max-redirs 0 --connect-timeout 10 --max-time 30 \
            https://console.relnets.com/.well-known/openid-configuration \
            --output /tmp/discovery.json
          curl --fail --silent --show-error \
            --max-redirs 0 --connect-timeout 10 --max-time 30 \
            https://console.relnets.com/.well-known/jwks.json \
            --output /tmp/jwks.json
          node -e "const d=require('/tmp/discovery.json'); if(!d.issuer || !d.jwks_uri) process.exit(1)"
          node -e "const j=require('/tmp/jwks.json'); if(!Array.isArray(j.keys) || !j.keys.length) process.exit(1)"

      - name: Public auth surfaces contain no legacy RelNets hosts
        run: |
          set -euo pipefail
          ! grep -Eqi 'auth\.relead\.com\.mx|console\.relead\.com\.mx|api\.relead\.com\.mx|builder\.relead\.com\.mx' \
            /tmp/login.html /tmp/signup.html
