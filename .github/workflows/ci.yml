name: ReLead App CI (Canonical Redirect)

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Guard canonical naming
        run: |
          grep -Rni 'console.relnets.com' src test
          ! grep -Rni --exclude-dir=node_modules 'console.relead.com.mx' src test
          ! grep -Rni --exclude-dir=node_modules 'My RelNet' src test
