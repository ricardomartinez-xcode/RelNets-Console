name: Console Alias Loop Hotfix CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'README.md'
      - '.github/workflows/console-loop-hotfix.yml'
  push:
    branches:
      - 'hotfix/v90-console-alias-loop'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Prevent console self-loop regression
        run: |
          grep -q "DEFAULT_CONSOLE_UI_ORIGIN = 'https://admin.relead.com.mx'" src/policy.js
          grep -q 'assertDistinctUiOrigin' src/index.js
          grep -q 'proxyConsoleUi' src/index.js
          ! grep -n "redirect(canonicalConsoleUrl(url))" src/index.js
      - name: Keep API traffic out of UI proxy
        run: |
          grep -q "'/admin/api/'" src/policy.js
          grep -q "'/console/api/'" src/policy.js
          grep -q "'/oauth/'" src/policy.js
          grep -q "'/ws/'" src/policy.js
