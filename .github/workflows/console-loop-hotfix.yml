name: Console User Plane Boundary CI

on:
  pull_request:
    paths:
      - 'src/**'
      - 'test/**'
      - 'middleware.js'
      - 'README.md'
      - '.github/workflows/console-loop-hotfix.yml'
  push:
    branches:
      - 'hotfix/v90-console-alias-loop'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run check
      - name: Enforce Builder and user-plane separation
        run: |
          ! grep -q "'/admin/api/'" src/policy.js
          ! grep -q "path === '/admin' || path.startsWith('/admin/')" src/policy.js
          grep -q 'Builder/admin is intentionally not a Console surface' src/index.js
          grep -q 'RELNET_NORTHBOUND_ORIGIN' middleware.js
          grep -q 'USER_MCP_RESOURCE' middleware.js
      - name: Keep canonical API and MCP on Northbound
        run: |
          grep -q "'/v2'" middleware.js
          grep -q "'/mcp'" middleware.js
          grep -q 'proxyNorthbound' middleware.js
          ! grep -q 'USER_MCP_ORIGIN' middleware.js
