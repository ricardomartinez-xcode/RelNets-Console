name: diag brand
on:
  pull_request:
    branches: [feat/auth-gated-console-20260825]
permissions:
  contents: read
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node --test --test-name-pattern="Console branding" test/relnet-next-ui.test.js
